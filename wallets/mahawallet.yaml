name: "MahaWallet"
wallet-name: mahawallet
website: "https://mahawallet.xyz"
contact: "contact@mahawallet.xyz"
added: "2026-10-15"
slack_party_scaling_channel_joined: true

# Same order as wallets/TEMPLATE.yaml. Every feature id in the template appears
# below: claimed (with proof), declared not supported (with a reason), or left
# commented out because it is not claimed yet. Commented blocks render as "-".

features:
  # Wallet Type
  wallet_model: [Retail, Enterprise]
  custody_model: Self-custodial
  form_factor: [Browser-extension]
  deployment_model: [Hybrid]   # keys and signing in the user's browser; backend and validator hosted by us

  # Canton Coin
  cc_support:
    supported: true
    proof: proofs/mahawallet/mahawallet-self-attestation.md#cc-support-cc_support
    verified_by: []

  two_step_cc_transfers:
    supported: true
    proof: proofs/mahawallet/mahawallet-self-attestation.md#two-step-cc-transfers-two_step_cc_transfers
    verified_by: []

  preapprovals:
    supported: true
    proof: proofs/mahawallet/mahawallet-self-attestation.md#pre-approvals-for-cc-preapprovals
    verified_by: []

  # Token Standard
  cip_0056_transfer:
    supported: true
    proof: proofs/mahawallet/mahawallet-self-attestation.md#cip-0056-token-standard-transfer-support-cip_0056_transfer
    verified_by: []

  # Not claimed: no evidence of the allocation half of CIP-0056.
  # cip_0056_allocation:
  #   supported: true
  #   proof: null
  #   verified_by: []

  # Not claimed: CIP-112 v2 tokens not tested.
  # cip_112_v2:
  #   supported: true
  #   proof: null
  #   verified_by: []

  memo_tag_support:
    supported: true
    proof: proofs/mahawallet/mahawallet-self-attestation.md#memo-tag-support-for-transfers-to-omnibus-accounts-memo_tag_support
    verified_by: []

  # dApp Connectivity (CIP-103)
  # Self-attested: the window.canton provider (Canton SDK) is injected into pages.
  # No third-party dApp run is on record, so there is no proof link.
  cip_0103_dapp_api:
    supported: true
    proof: null
    verified_by: []

  walletconnect_support:
    supported: false
    reason: "Not built. dApps connect through the CIP-0103 window.canton provider."
    proof: null
    verified_by: []

  # App Specific
  # Not claimed yet: needs a token preapproval enabled and a non-CC transfer that auto-accepted.
  # registry_preapprovals:
  #   supported: true
  #   proof: null
  #   verified_by: []

  # Not claimed: not verified either way.
  # wallet_gateway_signing_driver:
  #   supported: true
  #   proof: null
  #   verified_by: []

  # Party Specific
  key_generation_method: "BIP-39 seed phrase, SLIP-0010 Ed25519 derivation (Canton coin type), generated in the browser"

  key_recovery:
    supported: true      # seed phrase import / recovery

  social_recovery:
    supported: false
    reason: "Recovery is by seed phrase only; no guardian or contact-based recovery."

  multi_address:
    supported: true      # several accounts (parties) in one wallet

  distributed_parties:
    supported: false
    reason: "Each account is a single-signer external party."
    proof: null
    verified_by: []

  # Network Relevant Features
  # Not claimed: no evidence of merge-delegation support.
  utxo_merge_delegation:
     supported: true
     proof: null
     verified_by: []

  # Validator Hosting
  validator_hosting_byov:
    supported: true
  validator_hosting_private:
    supported: false
    reason: "No dedicated validator per customer."
  validator_hosting_shared:
    supported: false
    reason: "Bring-your-own-validator only; there is no shared validator option."

  # Transaction Signing
  policy_workflows:
    supported: false
    reason: "No approval-policy engine; the wallet owner approves each transaction."

  threshold_signature_scheme:
    supported: false
    reason: "Single-key signing (Ed25519); no MPC or threshold scheme."

  hardware_wallet_support:
    supported: false
    reason: "Keys are held by the extension; hardware signers are not supported."
    proof: null
    verified_by: []

  # Wallet Capabilities
  # Not claimed: no compliance certifications to declare.
  # compliance: "<short description of certifications/capabilities>"

  tokenization:
    supported: false
    reason: "The wallet holds and moves tokens; it does not issue or tokenize assets."
    proof: null
    verified_by: []

  # Not claimed: not verified.
  # reward_minting:
  #   supported: true
  #   proof: null
  #   verified_by: []

  # transfer_proof:
  #   supported: true
  #   proof: null
  #   verified_by: []

  # Not claimed yet: the approval screens need to be checked and a real transaction recorded.
  # clear_signing:
  #   supported: true
  #   proof: null
  #   verified_by: []

  integrated_swaps:
    supported: true
    proof: proofs/mahawallet/mahawallet-self-attestation.md#integrated-swaps-integrated_swaps
    verified_by: []

  assets_supported: ["CC", "USDCx", "CBTC", "cETH"]
  languages_supported: ["English", "Indonesian"]
